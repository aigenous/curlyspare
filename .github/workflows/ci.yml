name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Unit tests with V8 coverage
        run: pnpm exec vitest run --coverage
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage
          retention-days: 7
          if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Production build
        env:
          VERCEL_ENV: production
          VITE_SITE_URL: https://curlyspare.vercel.app
        run: pnpm build
      - name: Check fonts are self-hosted
        run: bash scripts/check-dist-fonts.sh dist
        env:
          REQUIRE_DESIGN_FONTS: '1'
      - name: Self-test dist HTML comments
        run: bash scripts/check-dist-html-comments.sh --self-test
      - name: Check dist HTML comments
        run: bash scripts/check-dist-html-comments.sh dist
      - name: Self-test dist internal links
        run: node scripts/check-dist-internal-links.mjs --self-test
      - name: Check dist internal links
        run: node scripts/check-dist-internal-links.mjs dist
      - name: Self-test dist example hosts
        run: bash scripts/check-dist-example-hosts.sh --self-test
      # Known example.com samples still fail this scan. Keep going so the
      # publish guards run, then fail the job from the recorded outcome.
      - name: Check dist example hosts
        id: example-hosts
        continue-on-error: true
        run: bash scripts/check-dist-example-hosts.sh dist
      - name: Self-test published tool counts
        run: node scripts/check-dist-tool-counts.mjs --self-test
      - name: Check published tool counts
        run: node scripts/check-dist-tool-counts.mjs dist
      - name: Self-test redirect destinations
        run: node scripts/check-dist-redirects.mjs --self-test
      - name: Check redirect destinations
        run: node scripts/check-dist-redirects.mjs dist
      - name: Fail when example hosts were found
        if: steps.example-hosts.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    name: E2E (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: Run Playwright
        run: pnpm test:e2e -- --project=chromium
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: warn

  licenses:
    name: Licence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Fail on GPL, AGPL, or LGPL dependencies
        run: node scripts/check-licenses.mjs

  commit-identity:
    name: Commit identity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check commits between the pull request base and head
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git cat-file -e "${base}^{commit}" 2>/dev/null || git fetch --no-tags origin "$base"
          git cat-file -e "${head}^{commit}" 2>/dev/null || git fetch --no-tags origin "$head"
          bash scripts/check-commit-identity.sh "$base" "$head"
